services:
  postgres:
    image: postgres:15-alpine
    container_name: chess_db
    env_file:
      - configs/.env
    restart: always
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    image: migrate/migrate:v4.16.2
    container_name: chess_migrator
    env_file:
      - configs/.env
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chess_backend
    env_file:
      - configs/.env
    environment:
      PORT: 8080
      DOCS_HOST: 0.0.0.0
      DOCS_PORT: 65000
      GIN_MODE: release
      FRONTEND_DIST_DIR: /app/frontend/dist
      DB_DSN: host=postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=5432 sslmode=disable TimeZone=UTC
    restart: unless-stopped
    expose:
      - "8080"
      - "65000"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  pgdata:
