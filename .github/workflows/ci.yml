name: Chess API Backend CI

on:
  push:
    branches: [ "main", "backend", "backend/**", "unification", "unification/backend/**"]
  pull_request:
    branches: [ "main", "backend", "backend/**", "unification", "unification/backend/**"]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chess-monolith

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Install dependencies
        run: |
          go mod tidy
          go mod download

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Verify Build
        run: go build -o /dev/null ./cmd/server/main.go

      - name: Calculate coverage and generate badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Total coverage: $COVERAGE"
          
          # Remove % and determine color
          COVERAGE_NUM=${COVERAGE//%/}
          COLOR="red"
          if (( $(echo "$COVERAGE_NUM > 80" | awk '{print $1}') )); then
            COLOR="brightgreen"
          elif (( $(echo "$COVERAGE_NUM > 50" | awk '{print $1}') )); then
            COLOR="yellow"
          fi
          
          BADGE_URL="https://img.shields.io/badge/Coverage-${COVERAGE//%/%25}-${COLOR}.svg"
          
          # We use sed to replace the placeholder in README.md and README.ru.md
          cd ..
          sed -i "s|<!-- coverage-badge -->.*<!-- /coverage-badge -->|<!-- coverage-badge -->[![Coverage]($BADGE_URL)](#)<!-- /coverage-badge -->|g" README.md
          sed -i "s|<!-- coverage-badge -->.*<!-- /coverage-badge -->|<!-- coverage-badge -->[![Coverage]($BADGE_URL)](#)<!-- /coverage-badge -->|g" README.ru.md

      - name: Commit and push changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd ..
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md README.ru.md
          git diff-index --quiet HEAD || git commit -m "docs: Update coverage badge"
          git push